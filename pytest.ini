[pytest]
pythonpath = src
testpaths = tests
# Extras-dependent tests live in tests/sigma and run only when that path is
# passed explicitly (Windows CI job). The remaining patterns are pytest's
# defaults, which norecursedirs replaces.
norecursedirs = tests/sigma *.egg .* _darcs build CVS dist node_modules venv {arch}
markers =
    wazuh_logtest: generated test requires a Wazuh logtest daemon
