name: Test

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -v
      - run: wazuhtestgen --help
      - run: python -m wazuhtestgen --help

  sigma-extra:
    if: github.ref_name == 'experimental/sigma-atomic'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      # Pip cannot resolve the released pipeline metadata against pySigma 2.
      # uv's override matches Zircolite's own supported development setup.
      - run: python -m pip install "uv>=0.9,<1"
      - run: uv pip install --system -e ".[sigma]" --override requirements/sigma-overrides.txt
      - run: python -m zircolite --help
      - run: python -m zircolite --pipeline-list
      - run: python -c "import zircolite, wazuhevtx; print(zircolite.__version__)"
      - run: python -m pytest tests/test_sigma.py -v
      - run: wazuhtestgen sigma --help
