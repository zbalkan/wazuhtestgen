[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuhtestgen"
version = "0.4.1"
description = "Generate pytest-formatted Wazuh rule tests from INI regression tests, EVTX files, or rule XML"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Zafer Balkan", email = "zafer@zaferbalkan.com" },
]
keywords = ["wazuh", "pytest", "detection-engineering", "security", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
]
dependencies = [
  "wazuhevtx>=1.1,<2; platform_system == 'Windows'",
]

[project.optional-dependencies]
# Opt-in Sigma test tooling. The experimental Zircolite provider needs
# Python >=3.11, and is installed separately from requirements/sigma-backend.txt
# because PyPI-distributed packages cannot declare direct Git URL dependencies.
# wazuhtester executes only on Linux with the local wazuh-logtest Unix socket.
sigma = [
  "wazuhtester>=0.1,<1; platform_system == 'Linux'",
  "pytest>=8,<10",
]
test = ["pytest>=8,<10"]
build = ["build>=1.2", "twine>=5"]
# Exact pins: ruff's default rule set and mypy's checks change between
# releases, so CI and local runs must use the same versions. mypy 2.x
# needs Python >=3.10; the package itself still supports 3.9.
lint = ["ruff==0.16.8", "mypy==2.3.1; python_version >= '3.10'"]
dev = [
  "pytest>=8,<10",
  "build>=1.2",
  "twine>=5",
  "ruff==0.16.8",
  "mypy==2.3.1; python_version >= '3.10'",
]

[project.scripts]
wazuhtestgen = "wazuhtestgen.generator:run"

[project.urls]
Homepage = "https://github.com/zbalkan/wazuhtestgen"
Repository = "https://github.com/zbalkan/wazuhtestgen"
Issues = "https://github.com/zbalkan/wazuhtestgen/issues"

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
include = ["wazuhtestgen*"]

[tool.ruff.lint.per-file-ignores]
# Renaming would change the module's import path for no functional gain.
"src/wazuhtestgen/internal/iniParser.py" = ["N999"]

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
# Windows-only dependency without type information.
module = ["wazuhevtx", "wazuhevtx.*"]
ignore_missing_imports = true
