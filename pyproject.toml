[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuhtestgen"
version = "0.4.1"
description = "Generate pytest-formatted Wazuh rule tests from INI regression tests, EVTX files, or rule XML"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Zafer Balkan", email = "zafer@zaferbalkan.com" },
]
keywords = ["wazuh", "pytest", "detection-engineering", "security", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
]
dependencies = [
  "wazuhevtx>=1.1,<2; platform_system == 'Windows'",
]

[project.optional-dependencies]
# Opt-in experimental Sigma mode; initial provider Zircolite requires Python >=3.11.
# Zircolite's 4.5.0 Python distribution is installed from its pinned source
# revision; the project is not currently available as a 4.5.x PyPI wheel.
# Direct VCS references are for the experiment, not a publishable PyPI release.
sigma = [
  "Zircolite @ git+https://github.com/wagga40/Zircolite.git@2557ed1672e9f0281fcb2937bf38dd49cbc52d8e",
  "wazuhtester>=0.1,<1",
  "pytest>=8,<10",
]
test = ["pytest>=8,<10"]
build = ["build>=1.2", "twine>=5"]
dev = ["pytest>=8,<10", "build>=1.2", "twine>=5"]

[project.scripts]
wazuhtestgen = "wazuhtestgen.generator:run"

[project.urls]
Homepage = "https://github.com/zbalkan/wazuhtestgen"
Repository = "https://github.com/zbalkan/wazuhtestgen"
Issues = "https://github.com/zbalkan/wazuhtestgen/issues"

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
include = ["wazuhtestgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=prepend"
